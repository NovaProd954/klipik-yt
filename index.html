<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klipik - Mini Video Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Drop Overlay -->
    <div class="drop-overlay" id="dropOverlay">
        <div class="drop-overlay-content">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <p>Drop video file to upload</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-left">
            <div class="navbar-logo" id="logoBtn" title="Home">
           <img src="assets/klipik.png" alt="Klipik Logo" class="logo-img">
           <span>Klipik</span>
            </div>
        </div>
        <div class="navbar-center">
            <input type="text" class="search-input" id="searchInput" placeholder="Search videos..." aria-label="Search videos">
            <button class="search-clear" id="searchClear" aria-label="Clear search" title="Clear">✕</button>
        </div>
        <div class="navbar-right">
            <button class="btn-icon" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark mode">
                <svg id="themeIconSun" viewBox="0 0 24 24" style="display:none;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                <svg id="themeIconMoon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
            <button class="btn btn-accent" id="uploadBtn" aria-label="Upload video">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span class="upload-btn-text">Upload</span>
            </button>
        </div>
    </nav>
    <input type="file" class="hidden-input" id="fileInput" accept="video/*,.mp4,.webm,.ogg,.mov,.mkv" aria-label="Select video file">

    <!-- Main Content -->
    <main class="main-container" id="mainContainer">
        <!-- Player Section -->
        <section class="player-section" id="playerSection">
            <div class="player-wrapper">
                <div class="player-top-bar">
                    <span class="player-title" id="playerTitle">Video Title</span>
                    <div class="player-meta">
                        <span id="playerViews">0 views</span>
                        <span id="playerDate"></span>
                    </div>
                    <div class="player-actions">
                        <button class="btn-like" id="btnLike" aria-label="Like video">
                            <svg viewBox="0 0 24 24"><path d="M14 9V5.5C14 4.12 12.88 3 11.5 3S9 4.12 9 5.5V9H4.17C3.25 9 2.58 9.85 2.83 10.75l1.72 6.5C4.83 18.23 5.76 19 6.83 19H16c1.1 0 2-.9 2-2v-6.5c0-.83-.67-1.5-1.5-1.5H14z"/></svg>
                            <span id="likeCount">0</span>
                        </button>
                        <button class="btn-close-player" id="btnClosePlayer" aria-label="Close player" title="Close player">✕</button>
                    </div>
                </div>
                <div class="video-container" id="videoContainer">
                    <video id="videoElement" preload="metadata" playsinline></video>
                    <div class="play-overlay visible" id="playOverlay">
                        <div class="play-overlay-icon">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>
                <div class="player-controls" id="playerControls">
                    <button class="ctrl-btn" id="btnPlayPause" aria-label="Play/Pause" title="Play/Pause">
                        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                    <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" step="0.1" aria-label="Seek" title="Seek">
                    <button class="ctrl-btn" id="btnMute" aria-label="Mute/Unmute" title="Mute/Unmute">
                        <svg id="iconVolumeHigh" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.47 4.47 0 002.5-3.5zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg id="iconVolumeMuted" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12A4.5 4.5 0 0014 8.5v2.06l2.45 2.45c.03-.33.05-.67.05-1.01zM3 9v6h4l5 5V4L7 9H3zm16.77 2.23l-1.41 1.41L16.95 14l1.41 1.41-1.41 1.41L15.54 15.4l-1.41 1.41-1.41-1.41L14.13 14l-1.41-1.41 1.41-1.41 1.41 1.41 1.41-1.41 1.41 1.41zM4 4l16 16"/></svg>
                    </button>
                    <input type="range" class="volume-bar" id="volumeBar" min="0" max="1" value="1" step="0.05" aria-label="Volume" title="Volume">
                    <button class="ctrl-btn" id="btnFullscreen" aria-label="Fullscreen" title="Fullscreen">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Video Grid Section -->
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Your Library</h2>
            <span class="result-count" id="resultCount"></span>
        </div>
        <div class="video-grid" id="videoGrid"></div>
        <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM9 8h6v2H9V8zm0 4h6v2H9v-2z"/></svg>
            <h3>No videos yet</h3>
            <p>Upload your first video to get started. Click the Upload button or drag and drop a video file here.</p>
            <button class="btn btn-accent" id="emptyUploadBtn">Upload Video</button>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
  </html>
